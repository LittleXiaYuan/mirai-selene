<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="Mirai-Selene 架构图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0e16"/>
      <stop offset="1" stop-color="#080910"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7dff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6478"/>
    </marker>
    <style>
      .t { font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; fill:#e8ecff; }
      .s { font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; fill:#98a1bb; }
      .m { font-family: ui-monospace, Consolas, monospace; fill:#a9c6ff; }
      .box { fill:#12151f; stroke:#252b3d; stroke-width:1.2; rx:14; }
      .lane { fill:none; stroke:#1d2231; stroke-width:1; }
      .flow { stroke:#5b6478; stroke-width:1.4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>

  <!-- title -->
  <text x="48" y="58" class="t" font-size="24" font-weight="600">Mirai-Selene · PAI-SSM 架构</text>
  <text x="48" y="84" class="s" font-size="13">状态原生：听声辨心 → 可合并状态核 → 生死分位数 → 世界线合流</text>

  <!-- lanes -->
  <text x="48" y="132" class="s" font-size="12" letter-spacing="2">01 · 输入</text>
  <text x="300" y="132" class="s" font-size="12" letter-spacing="2">02 · 声学韵律</text>
  <text x="556" y="132" class="s" font-size="12" letter-spacing="2">03 · 状态核</text>
  <text x="812" y="132" class="s" font-size="12" letter-spacing="2">04 · 决策</text>
  <text x="1068" y="132" class="s" font-size="12" letter-spacing="2">05 · 交付</text>
  <line x1="48" y1="146" x2="1232" y2="146" class="lane"/>

  <!-- 01 input -->
  <rect x="48" y="176" width="196" height="220" class="box"/>
  <text x="68" y="208" class="t" font-size="15" font-weight="600">现实输入</text>
  <text x="68" y="238" class="s" font-size="12.5">· 语音（原始波形）</text>
  <text x="68" y="264" class="s" font-size="12.5">· 文本 / 台词</text>
  <text x="68" y="290" class="s" font-size="12.5">· 小红书 / 抖音热帖</text>
  <text x="68" y="316" class="s" font-size="12.5">· 评论流快照</text>
  <text x="68" y="354" class="m" font-size="11">不吃 ASR 转写，</text>
  <text x="68" y="372" class="m" font-size="11">保留语气与停顿</text>

  <!-- 02 prosody -->
  <rect x="300" y="176" width="200" height="220" class="box"/>
  <text x="320" y="208" class="t" font-size="15" font-weight="600">12 维声学韵律</text>
  <text x="320" y="238" class="s" font-size="12.5">开口犹豫潜伏期</text>
  <text x="320" y="262" class="s" font-size="12.5">半卡壳断续率</text>
  <text x="320" y="286" class="s" font-size="12.5">“呃 / 嗯”填充停顿</text>
  <text x="320" y="310" class="s" font-size="12.5">句末音高上扬 / 下沉</text>
  <text x="320" y="334" class="s" font-size="12.5">声带微颤 Jitter</text>
  <text x="320" y="358" class="s" font-size="12.5">语速 · 底气衰减</text>

  <!-- 03 core -->
  <rect x="556" y="176" width="212" height="220" class="box" stroke="#3b4270"/>
  <text x="576" y="208" class="t" font-size="15" font-weight="600">PAI-SSM 状态核</text>
  <text x="576" y="240" class="m" font-size="12">A = λI + Σ γ k kᵀ</text>
  <text x="576" y="262" class="m" font-size="12">B = Σ γ v kᵀ</text>
  <text x="576" y="284" class="m" font-size="12">W = B A⁻¹</text>
  <text x="576" y="318" class="s" font-size="12.5">异方差写入精度 γ ₜ</text>
  <text x="576" y="342" class="s" font-size="12.5">正交怀疑通道</text>
  <text x="576" y="366" class="s" font-size="12.5">O(1) 显存 · 可热插拔</text>

  <!-- 04 decision -->
  <rect x="812" y="176" width="212" height="220" class="box"/>
  <text x="832" y="208" class="t" font-size="15" font-weight="600">博弈决策</text>
  <text x="832" y="240" class="s" font-size="12.5">六档反讨好姿态</text>
  <text x="832" y="264" class="s" font-size="12.5">闭式 EIG 盲区追问</text>
  <text x="832" y="288" class="s" font-size="12.5">五档生死分位数</text>
  <text x="832" y="312" class="s" font-size="12.5">破产危险率 P(ruin)</text>
  <text x="832" y="336" class="s" font-size="12.5">三重贝叶斯报警</text>
  <text x="832" y="368" class="m" font-size="11">不是均值，是分布</text>

  <!-- 05 delivery -->
  <rect x="1068" y="176" width="164" height="220" class="box"/>
  <text x="1088" y="208" class="t" font-size="15" font-weight="600">交付</text>
  <text x="1088" y="240" class="s" font-size="12.5">沉浸舞台</text>
  <text x="1088" y="264" class="s" font-size="12.5">2×5 世界线画廊</text>
  <text x="1088" y="288" class="s" font-size="12.5">决策卡（Markdown）</text>
  <text x="1088" y="312" class="s" font-size="12.5">.world 资产文件</text>
  <text x="1088" y="344" class="m" font-size="11">可回滚 · 可带走</text>

  <!-- arrows -->
  <path d="M244 286 H292" class="flow"/>
  <path d="M500 286 H548" class="flow"/>
  <path d="M768 286 H804" class="flow"/>
  <path d="M1024 286 H1060" class="flow"/>

  <!-- bottom: worldline merge -->
  <rect x="48" y="436" width="1184" height="88" rx="14" fill="#0f121b" stroke="#252b3d"/>
  <text x="72" y="468" class="t" font-size="14" font-weight="600">世界线代数：分支零拷贝，合流机器精度</text>
  <text x="72" y="494" class="m" font-size="13">S_out = S_a + S_b − S_base</text>
  <text x="420" y="494" class="s" font-size="12.5">交换律成立 · 重复合并不翻倍 · 实测相对误差 2.12e-16</text>
  <text x="1000" y="494" class="s" font-size="12.5">墓碑不可逆</text>

  <!-- accent line -->
  <rect x="48" y="96" width="1184" height="2" fill="url(#accent)" opacity="0.55"/>
</svg>
